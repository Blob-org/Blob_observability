name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Validate, smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Test the PR issue check script
        run: bun test scripts

      - name: Validate configs
        run: ./scripts/validate.sh

      - name: Smoke test (stack up, a log line reaches Loki and Grafana)
        run: ./scripts/smoke.sh --down
